<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KREWNOX — Modern Fashion, Outerwear & Sneakers</title>

    <!-- Baseline metadata for the brief pre-hydration window and for any crawler that
         doesn't run JavaScript and isn't on the known-bot allowlist handled server-side
         (see server/src/routes/socialPreview.ts). Every route overrides these at runtime
         via the shared <Seo> component (src/components/seo/Seo.tsx) once React mounts. -->
    <meta
      name="description"
      content="KREWNOX is a modern fashion studio for tailored outerwear, sculptural sneakers, and studio-grade essentials — designed as a system, not a statement."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://krewnox.ca/" />
    <meta property="og:site_name" content="KREWNOX" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KREWNOX — Modern Fashion, Outerwear & Sneakers" />
    <meta
      property="og:description"
      content="Tailored outerwear, sculptural sneakers, and studio-grade essentials — designed as a system, not a statement."
    />
    <meta property="og:url" content="https://krewnox.ca/" />
    <meta property="og:image" content="https://krewnox.ca/brand/logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KREWNOX — Modern Fashion, Outerwear & Sneakers" />
    <meta
      name="twitter:description"
      content="Tailored outerwear, sculptural sneakers, and studio-grade essentials — designed as a system, not a statement."
    />
    <meta name="twitter:image" content="https://krewnox.ca/brand/logo.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Warm up connections to the origins every page needs so DNS/TLS handshake
         happens in parallel with the initial HTML/JS parse instead of after it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://foplahkaijdjjumjmrgp.supabase.co" />
    <link rel="preconnect" href="https://js.stripe.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <script>
      ;(function () {
        try {
          var cached = localStorage.getItem('krewnox-appearance')
          var theme = cached === 'dark' || cached === 'light' ? cached : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
