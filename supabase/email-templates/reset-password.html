<!--
  Supabase "Reset Password" email template.

  Not read by Supabase automatically — there is no local Supabase CLI config in this
  project wiring email templates to files. To apply it:

    1. Supabase Dashboard -> your project -> Authentication -> Email Templates -> Reset Password
    2. Subject heading: Reset your password
    3. Paste everything below (from <!doctype> down) into the "Message body" field
    4. Save

  Supabase's default recovery link expiry is 1 hour (Authentication -> Settings ->
  "Email OTP expiry" / link expiry) — the copy below assumes that; update it if you change
  the expiry.

  Only {{ .ConfirmationURL }} is used, which Supabase populates with the recovery link that
  lands the user on /reset-password in the app.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff;">
            <tr>
              <td style="padding:40px 40px 24px 40px; text-align:center;">
                <span style="font-family:Arial,Helvetica,sans-serif; font-size:11px; font-weight:bold; letter-spacing:4px; color:#1a1a1a; text-transform:uppercase;">
                  Krewnox
                </span>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px;">
                <hr style="border:none; border-top:1px solid #eaeaea; margin:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:40px 40px 8px 40px; text-align:center;">
                <h1 style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:24px; font-weight:normal; color:#1a1a1a;">
                  Reset your password
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 40px 32px 40px; text-align:center;">
                <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:22px; color:#5a5a5a;">
                  Click below to choose a new password. This link expires in 1 hour and can only be used once.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 32px 40px; text-align:center;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; padding:14px 32px; background-color:#1a1a1a; color:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:12px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; text-decoration:none;"
                >
                  Reset password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 40px 40px; text-align:center;">
                <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#b0b0b0;">
                  Button not working? Copy and paste this link:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#8a8a8a; word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px; border-top:1px solid #eaeaea; text-align:center;">
                <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:11px; line-height:18px; color:#b0b0b0;">
                  Didn't request this? You can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
